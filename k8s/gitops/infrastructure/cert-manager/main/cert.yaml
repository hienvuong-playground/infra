apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: backend
spec:
  secretName: wildcard-tls
  privateKey:
    rotationPolicy: Always
  commonName: "*.${DOMAIN_NAME}"
  dnsNames:
    - "*.${DOMAIN_NAME}"
    - "${DOMAIN_NAME}"
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
