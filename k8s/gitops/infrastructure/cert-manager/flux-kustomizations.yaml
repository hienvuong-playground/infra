apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-init
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  path: ./k8s/gitops/infrastructure/cert-manager/init
  sourceRef:
    kind: GitRepository
    name: flux-config
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-main
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  dependsOn:
    - name: cert-manager-init
  path: ./k8s/gitops/infrastructure/cert-manager/main
  postBuild:
    substitute:
      DOMAIN_NAME: ${DOMAIN_NAME}
      RG_MANUAL: ${RG_MANUAL}
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID}
      MI_CERT_MANAGER: ${MI_CERT_MANAGER}
  sourceRef:
    kind: GitRepository
    name: flux-config
    namespace: flux-system