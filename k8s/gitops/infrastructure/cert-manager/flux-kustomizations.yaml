apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-init
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  path: ./gitops/infrastructure/cert-manager/init
  sourceRef:
    kind: GitRepository
    name: flux-config
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-main
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  dependsOn:
    - name: cert-manager-init
  path: ./gitops/infrastructure/cert-manager/main
  sourceRef:
    kind: GitRepository
    name: flux-config
    namespace: flux-system
