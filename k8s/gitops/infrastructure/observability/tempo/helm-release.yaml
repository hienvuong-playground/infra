apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: observability
  storageNamespace: observability
  releaseName: tempo
  chart:
    spec:
      chart: tempo
      version: "3.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  values:
    tempo:
      storage:
        trace:
          backend: azure
          azure:
            container_name: tempo-traces
            storage_account_name: ${OBSERVABILITY_STORAGE_ACCOUNT}
            use_federated_token: true
    podLabels:
      azure.workload.identity/use: "true"
    serviceAccount:
      name: tempo
      annotations:
        azure.workload.identity/client-id: ${ID_TEMPO}
