# tempo-ingress: default-deny ingress on Tempo, allowing only the OTEL tail
#                sampler (OTLP gRPC trace push) and Grafana (datasource queries).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tempo-ingress
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
  ingress:
    # OTEL tail sampler OTLP gRPC trace push
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: otel-tail-sampler-collector
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
    # Grafana datasource queries
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "3200"
              protocol: TCP
