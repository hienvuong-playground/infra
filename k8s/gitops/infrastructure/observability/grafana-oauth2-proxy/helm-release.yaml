apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: oauth2-proxy
  namespace: flux-system
spec:
  interval: 1h
  url: https://oauth2-proxy.github.io/manifests
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-oauth2-proxy
  namespace: flux-system
spec:
  interval: 10m
  releaseName: grafana-oauth2-proxy
  targetNamespace: observability
  storageNamespace: observability
  chart:
    spec:
      chart: oauth2-proxy
      version: "10.7.0"
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
        namespace: flux-system
  values:
    config:
      existingSecret: grafana-oauth2-proxy
      requiredSecretKeys:
        - cookie-secret
      upstreams:
        - http://observability-grafana.observability.svc.cluster.local
    extraArgs:
      provider: entra-id
      client-id: ${ID_GRAFANA_OAUTH2_PROXY}
      oidc-issuer-url: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
      entra-id-federated-token-auth: true
      redirect-url: https://grafana.${DOMAIN_NAME}/oauth2/callback
      skip-provider-button: true
    serviceAccount:
      annotations:
        azure.workload.identity/client-id: ${ID_GRAFANA_OAUTH2_PROXY}
    podLabels:
      azure.workload.identity/use: "true"
    extraVolumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: grafana-oauth2-proxy
    extraVolumeMounts:
      - name: secrets-store
        mountPath: /mnt/secrets-store
        readOnly: true
