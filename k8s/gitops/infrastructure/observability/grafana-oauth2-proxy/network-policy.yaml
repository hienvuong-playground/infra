apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-oauth2-proxy
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: grafana-oauth2-proxy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: istio-ingress
            gateway.networking.k8s.io/gateway-name: public
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Entra ID login endpoints; toFQDNs needs ACNS security, which is disabled.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
