# loki-ingress: default-deny ingress on Loki, allowing only Grafana
#               (datasource queries) and the OTEL Collector (OTLP log push).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki-ingress
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  ingress:
    - fromEndpoints:
        # Grafana datasource queries
        - matchLabels:
            app.kubernetes.io/name: grafana
        # OTEL Collector OTLP log push (/otlp/v1/logs)
        - matchLabels:
            app.kubernetes.io/name: otel-collector
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
