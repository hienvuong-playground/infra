apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: observability
  storageNamespace: observability
  releaseName: loki
  chart:
    spec:
      chart: loki
      version: "18.13.5"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  values:
    loki:
      auth_enabled: false
      podLabels:
        azure.workload.identity/use: "true"
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2026-09-01"
            store: tsdb
            object_store: azure
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: azure
        bucketNames:
          chunks: loki-chunks
          ruler: loki-ruler
        azure:
          accountName: ${OBSERVABILITY_STORAGE_ACCOUNT}
          useFederatedToken: true
    serviceAccount:
      name: loki
      annotations:
        azure.workload.identity/client-id: ${ID_LOKI}
    singleBinary:
      replicas: 1
    # Scalable targets default to 3 replicas; the chart rejects mixing them with monolithic.
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    # Default memcached caches request ~11Gi — too much for the single 16GiB node.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    # Clients hit loki:3100 directly; the helm test requires the canary.
    gateway:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
