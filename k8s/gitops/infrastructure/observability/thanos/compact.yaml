apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-compact
  namespace: observability
spec:
  # Only one compactor may run per bucket; Recreate avoids overlap during rollouts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-compact
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-compact
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: thanos
      containers:
        - name: thanos-compact
          image: quay.io/thanos/thanos:v0.42.4
          args:
            - compact
            - --wait
            - --data-dir=/var/thanos/compact
            - --objstore.config-file=/etc/thanos/objstore.yml
            # Each must outlive the next downsampling age (raw→5m at 40h, 5m→1h at 10d).
            - --retention.resolution-raw=30d
            - --retention.resolution-5m=90d
            - --retention.resolution-1h=365d
          volumeMounts:
            - name: data
              mountPath: /var/thanos/compact
            - name: objstore
              mountPath: /etc/thanos
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
        - name: objstore
          configMap:
            name: thanos-objstore
