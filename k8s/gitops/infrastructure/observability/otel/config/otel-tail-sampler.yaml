apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-tail-sampler
  namespace: observability
  labels:
    azure.workload.identity/use: "true"
spec:
  # Fixed: changing the replica count reshuffles in-flight traces between pods.
  replicas: 2
  serviceAccount: otel-collector
  config:
    receivers:
      otlp:
        protocols:
          grpc: {}
    extensions:
      # $$ escapes Flux postBuild substitution; the collector expands these
      # from env vars injected by the workload identity webhook.
      azure_auth:
        workload_identity:
          client_id: $${env:AZURE_CLIENT_ID}
          tenant_id: $${env:AZURE_TENANT_ID}
          federated_token_file: $${env:AZURE_FEDERATED_TOKEN_FILE}
        scopes:
          - https://monitor.azure.com/.default
    processors:
      batch: {}
      # Server-side 4xx is UNSET per HTTP semconv, so those traces fall into sample-rest.
      tail_sampling:
        decision_wait: 10s
        policies:
          - name: keep-errors
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: keep-slow
            type: latency
            latency:
              threshold_ms: 2000
          # A drop decision overrides keep-errors and keep-slow, so failed or slow
          # probes have to be excluded here; those policies can't rescue them.
          - name: drop-health
            type: drop
            drop:
              drop_sub_policy:
                - name: health-route
                  type: string_attribute
                  string_attribute:
                    key: http.route
                    values: [/livez, /readyz]
                - name: no-error
                  type: not
                  not:
                    not_sub_policy:
                      name: any-error
                      type: status_code
                      status_code:
                        status_codes: [ERROR]
                - name: not-slow
                  type: not
                  not:
                    not_sub_policy:
                      name: slow
                      type: latency
                      latency:
                        threshold_ms: 2000
          - name: sample-rest
            type: probabilistic
            probabilistic:
              sampling_percentage: 10
    exporters:
      otlp/tempo:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true
      otlphttp/azuremonitor:
        traces_endpoint: ${AZMON_OTLP_TRACES_ENDPOINT}
        auth:
          authenticator: azure_auth
    service:
      extensions: [azure_auth]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [tail_sampling, batch]
          exporters: [otlp/tempo, otlphttp/azuremonitor]
