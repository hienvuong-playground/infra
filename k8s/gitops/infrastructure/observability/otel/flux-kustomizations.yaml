apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otel-operator
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  path: ./k8s/gitops/infrastructure/observability/otel/operator
  sourceRef:
    kind: GitRepository
    name: flux-config
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otel-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  dependsOn:
    - name: otel-operator
  path: ./k8s/gitops/infrastructure/observability/otel/config
  sourceRef:
    kind: GitRepository
    name: flux-config
    namespace: flux-system
  # Child Kustomizations don't inherit the parent's substitutions; these
  # values are filled in by flux-config-cluster when it applies this file.
  postBuild:
    substitute:
      ID_OTEL_COLLECTOR: ${ID_OTEL_COLLECTOR}
      AZMON_OTLP_TRACES_ENDPOINT: ${AZMON_OTLP_TRACES_ENDPOINT}
      AZMON_OTLP_LOGS_ENDPOINT: ${AZMON_OTLP_LOGS_ENDPOINT}
      AZMON_OTLP_METRICS_ENDPOINT: ${AZMON_OTLP_METRICS_ENDPOINT}
