apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: observability
  storageNamespace: observability
  chart:
    spec:
      chart: grafana
      version: "13.2.5"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  values:
    serviceAccount:
      annotations:
        azure.workload.identity/client-id: ${ID_GRAFANA}
    podLabels:
      azure.workload.identity/use: "true"
    grafana.ini:
      server:
        root_url: https://grafana.${DOMAIN_NAME}
      auth.azuread:
        enabled: true
        auto_login: true
        client_id: ${ID_GRAFANA}
        client_authentication: workload_identity
        federated_credential_audience: api://AzureADTokenExchange
        auth_url: https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/authorize
        token_url: https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token
        allowed_organizations: ${AZURE_TENANT_ID}
        org_mapping: ${GRAFANA_ADMINS_GROUP_ID}:1:Admin ${GRAFANA_DEVELOPERS_GROUP_ID}:1:Editor
    persistence:
      enabled: true
      storageClassName: managed-csi
      size: 10Gi
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            url: http://thanos-query.observability.svc.cluster.local:10902
            isDefault: true
          - name: Loki
            type: loki
            url: http://loki.observability.svc.cluster.local:3100
          - name: Tempo
            type: tempo
            url: http://tempo.observability.svc.cluster.local:3200
