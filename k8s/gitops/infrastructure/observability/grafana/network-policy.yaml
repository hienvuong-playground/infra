# grafana-egress: default-deny egress on Grafana, allowing only DNS and
#                 queries to the Thanos Query (Prometheus-type), Loki and Tempo datasources.
#
# NOTE: Cilium enforces on the destination *pod* port, not the Service port
# (e.g. Prometheus Service :80 → pod :9090).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-egress
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  egress:
    # DNS resolution (CoreDNS) — required to resolve datasource Services
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Prometheus datasource queries (served by Thanos Query)
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: thanos-query
      toPorts:
        - ports:
            - port: "10902"
              protocol: TCP
    # Loki datasource queries
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: loki
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: tempo
      toPorts:
        - ports:
            - port: "3200"
              protocol: TCP
