apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 10m
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: observability
  storageNamespace: observability
  chart:
    spec:
      chart: prometheus
      version: "27.44.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  rollback:
    timeout: 10m
    cleanupOnFail: false
  values:
    serviceAccounts:
      server:
        annotations:
          azure.workload.identity/client-id: ${ID_THANOS}
    alertmanager:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    prometheus-node-exporter:
      enabled: false
    kube-state-metrics:
      enabled: false
    server:
      fullnameOverride: prometheus-server
      # Long-term history lives in blob via the Thanos sidecar.
      retention: "2d"
      podLabels:
        azure.workload.identity/use: "true"
      global:
        external_labels:
          cluster: playground
      persistentVolume:
        enabled: true
        storageClass: managed-csi
        size: 20Gi
      service:
        type: ClusterIP
        gRPC:
          enabled: true
      extraFlags:
        - web.enable-lifecycle
        - web.enable-remote-write-receiver
        # Thanos sidecar: reads external labels via admin API; equal block durations disable local compaction.
        - web.enable-admin-api
        - storage.tsdb.min-block-duration=2h
        - storage.tsdb.max-block-duration=2h
      extraVolumes:
        - name: thanos-objstore
          configMap:
            name: thanos-objstore
      sidecarContainers:
        thanos-sidecar:
          image: quay.io/thanos/thanos:v0.42.4
          args:
            - sidecar
            - --tsdb.path=/data
            - --prometheus.url=http://localhost:9090
            - --objstore.config-file=/etc/thanos/objstore.yml
          ports:
            - name: grpc
              containerPort: 10901
          volumeMounts:
            - name: storage-volume
              mountPath: /data
            - name: thanos-objstore
              mountPath: /etc/thanos
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    serverFiles:
      prometheus.yml:
        scrape_configs: []
