apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 10m
  url: oci://ghcr.io/controlplaneio-fluxcd/charts
  type: oci
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-web
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: flux-system
  storageNamespace: flux-system
  chart:
    spec:
      chart: flux-operator
      version: "0.60.0"
      sourceRef:
        kind: HelmRepository
        name: flux-operator
        namespace: flux-system
  values:
    fullnameOverride: flux-web
    web:
      serverOnly: true
      # Chart policy allows 9080 from every namespace; Cilium allow rules are additive, so it would bypass the proxy.
      networkPolicy:
        create: false
      config:
        authentication:
          type: Anonymous
          anonymous:
            username: flux
            groups:
              - flux-admin
    installCRDs: true
