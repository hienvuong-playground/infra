apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-web-oauth2-proxy
  namespace: flux-system
spec:
  interval: 10m
  releaseName: flux-web-oauth2-proxy
  targetNamespace: oauth2-proxy
  storageNamespace: oauth2-proxy
  chart:
    spec:
      chart: oauth2-proxy
      version: "10.7.0"
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
        namespace: flux-system
  values:
    config:
      existingSecret: oauth2-proxy
      requiredSecretKeys:
        - cookie-secret
      upstreams:
        - http://flux-web-flux-operator.flux-system.svc.cluster.local:9080
    extraArgs:
      provider: entra-id
      client-id: ${ID_OAUTH2_PROXY}
      oidc-issuer-url: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
      entra-id-federated-token-auth: true
      redirect-url: https://flux.${DOMAIN_NAME}/oauth2/callback
      skip-provider-button: true
    serviceAccount:
      enabled: false
      name: oauth2-proxy
    podLabels:
      azure.workload.identity/use: "true"
    extraVolumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: oauth2-proxy
    extraVolumeMounts:
      - name: secrets-store
        mountPath: /mnt/secrets-store
        readOnly: true
