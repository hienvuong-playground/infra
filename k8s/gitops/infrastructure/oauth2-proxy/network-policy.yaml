# Shared by every oauth2-proxy instance; per-instance upstream egress lives next to each HelmRelease.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: istio-ingress
            gateway.networking.k8s.io/gateway-name: public
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Entra ID login endpoints; toFQDNs needs ACNS security, which is disabled.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
