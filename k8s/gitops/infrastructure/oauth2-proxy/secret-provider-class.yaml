apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
spec:
  provider: azure
  parameters:
    tenantId: ${AZURE_TENANT_ID}
    clientID: ${ID_OAUTH2_PROXY}
    keyvaultName: ${KEYVAULT_NAME}
    objects: |
      array:
        - |
          objectName: oauth2-proxy-cookie-secret
          objectType: secret
  secretObjects:
    - secretName: oauth2-proxy
      type: Opaque
      data:
        - objectName: oauth2-proxy-cookie-secret
          key: cookie-secret
