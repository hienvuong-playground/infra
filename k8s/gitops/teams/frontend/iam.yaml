apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-applier-role
  namespace: frontend
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-applier-binding
  namespace: frontend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-applier-role
subjects:
  - kind: ServiceAccount
    name: flux-applier
    namespace: frontend