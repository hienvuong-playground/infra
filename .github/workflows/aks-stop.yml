name: Stop AKS (nightly)

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  stop:
    runs-on: ubuntu-24.04
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Stop AKS
        run: az aks stop --name aks-playground --resource-group rg-playground
